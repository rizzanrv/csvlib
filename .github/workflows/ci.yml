name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      - name: Build library
        run: make CC=${{ matrix.cc }}

      - name: Run tests
        run: make test CC=${{ matrix.cc }}

      - name: Run example
        run: make example CC=${{ matrix.cc }}

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests with sanitizers
        run: make test CC=clang CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
